
name: Update Schedule

on:
  # Запуск раз в сутки в 3:00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Возможность ручного запуска
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check saved group catalogue
        run: |
          test -s groups/groups.json
          python -m json.tool groups/groups.json > /dev/null
          echo "Каталог групп найден и успешно проверен."

      - name: Run main schedule updater
        run: |
          echo "Запуск обновления расписаний (таймаут запроса: 10 сек)"
          python main.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet -- rasp/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rasp/*.ics
          git commit -m "🔄 Автоматическое обновление расписания"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changes != 'true'
        run: echo "Изменений в расписании не обнаружено"
